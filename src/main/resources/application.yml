spring:
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms

airtel-connector:
  redis:
    # redis (default) | memory — in-memory ConcurrentHashMap backup for local/single-pod
    type: ${AIRTEL_PAYBILL_STORE_TYPE:redis}
    key-prefix: ${REDIS_KEY_PREFIX:airtel-connector}
    ttl:
      paybill-workflow-seconds: ${REDIS_TTL_PAYBILL_WORKFLOW_SECONDS:172800}

camel:
  server-port: 5000
  springboot:
    main-run-controller: true
  dataformat:
    jackson:
      auto-discover-object-mapper: true

zeebe:
  client:
    max-execution-threads: 100
    number-of-workers: 5
    evenly-allocated-max-jobs: "#{${zeebe.client.max-execution-threads} / ${zeebe.client.number-of-workers}}"
    ttl: 30000
  broker:
    contactpoint: "localhost:26500"

skip:
  enabled: false

airtel:
  api:
    auth-endpoint: /auth/oauth2/token
    collection-endpoint: /merchant/v1/payments/
    status-endpoint: /standard/v1/payments
  credentials:
    zambia:
      base-url: https://openapiuat.airtel.co.zm
      client-id: "abc"
      client-secret: "xyz"
      grant-type: "client_credentials"
    rwanda:
      base-url: https://openapiuat.airtel.co.rw
      client-id: "abc"
      client-secret: "xyz"
      grant-type: "client_credentials"
    malawi:
      base-url: https://openapiuat.airtel.mw
      client-id: "abc"
      client-secret: "xyz"
      grant-type: "client_credentials"
  max-retry-count: 3
  # Read timeout of each Airtel call, in ms
  timeout: 6000
  resilience:
    job-deadline-margin: 10s
    token:
      connect-timeout: 5s
      read-timeout: ${airtel.timeout}ms
      retry:
        max-attempts: 3
        initial-backoff: 500ms
        backoff-multiplier: 2.0
        jitter: 0.5
        retry-status-codes: 500,502,503,504
        retry-when-outcome-unknown: true
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3
    # Not known to be deduplicated by Airtel: only a request that never reached Airtel is retried
    collection:
      connect-timeout: 5s
      read-timeout: ${airtel.timeout}ms
      retry:
        max-attempts: 3
        initial-backoff: 500ms
        backoff-multiplier: 2.0
        jitter: 0.5
        retry-status-codes:
        retry-when-outcome-unknown: false
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3
    transaction-status:
      connect-timeout: 5s
      read-timeout: ${airtel.timeout}ms
      retry:
        max-attempts: 3
        initial-backoff: 500ms
        backoff-multiplier: 2.0
        jitter: 0.5
        retry-status-codes: 500,502,503,504
        retry-when-outcome-unknown: true
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3

countryCodes: '{"rwf": "RW", "ugx": "UG", "kes": "KE", "mwk": "MW", "zmw": "ZM", "zmk": "ZM"}'

country:
  default-tenant: malawi
  currency:
    ZMW: zambia
    RWF: rwanda
    MWK: malawi

transaction-id-prefix: oaf-

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    ROOT: INFO

channel:
  host: "http://localhost:8080"

paybill:
  account-holding-institution-id: oaf
  timer: "PT45S"
  ams-short-codes:
    123456:
      ams-name: roster
      ams-url: http://localhost:5004
      identifier: ACCOUNTID
    789012:
      ams-name: fineract
      ams-url: http://localhost:5005
      identifier: FINERACTACCOUNTID
  default-short-code: 123456
